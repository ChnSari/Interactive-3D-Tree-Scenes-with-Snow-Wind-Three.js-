<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windy Snow Tree</title>

    <style>
        body{
            margin: 0;
            overflow: hidden;
            background: #bfe3ff;
        }

    </style>
</head>
<body>

    <canvas id="webgl"></canvas>

    <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

        //canvas
        const canvas = document.getElementById("webgl");

        //scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color("#bfe3ff");

        //camera
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(1.5, 1.2, 1.5);
        camera.lookAt(0, 7, 0);

        //renderer
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias:true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

        //light
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(5,10,5);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        //ground
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(30,30),
            new THREE.MeshStandardMaterial({ color:"#ffffff" })
        );
        ground.rotation.x = -Math.PI/2;
        scene.add(ground);

        //tree
        function createTree(){
            const group = new THREE.Group();
            
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5,0.7,7,16),
                new THREE.MeshStandardMaterial({ color:"#6b4423" })
                );

                trunk.position.y = 3.5;
                group.add(trunk);

                for(let i=0;i<100;i++){
                    const leaf = new THREE.Mesh(
                        new THREE.IcosahedronGeometry(0.6 + Math.random()*0.6, 0),
                        new THREE.MeshStandardMaterial({
                            color: new THREE.Color().setHSL(0.33,0.7,0.25 + Math.random()*0.2)
                })
            );

            const angle = Math.random()*Math.PI*2;
            const radius = Math.random()*3;

            leaf.position.set(
                Math.cos(angle)*radius,
                5 + Math.random()*4,
                Math.sin(angle)*radius
            );

            group.add(leaf);
        }
        return group;
    }

    scene.add(createTree());

    // snow - wınd
    const count = 4000;
    const positions = new Float32Array(count * 3);
    const velocities = [];

    for(let i=0;i<count;i++){
        positions[i*3] = (Math.random()-0.5)*10;
        positions[i*3+1] = Math.random()*15 + 2;
        positions[i*3+2] = (Math.random()-0.5)*10;

    //different movement to each particle
    velocities.push({
        speed: 0.015 + Math.random()*0.01,
        drift: Math.random()*0.01
    });
    }

    const snowGeo = new THREE.BufferGeometry();
    snowGeo.setAttribute("position", new THREE.BufferAttribute(positions,3));

    const snow = new THREE.Points(
        snowGeo,
        new THREE.PointsMaterial({ size:0.05 })
    );
    scene.add(snow);

    //anımatıon
    function animate(){
        requestAnimationFrame(animate);

        const pos = snowGeo.attributes.position.array;
        const time = Date.now() * 0.001;

        for(let i=0;i<count;i++){

            // decline
            pos[i*3+1] -= velocities[i].speed;

            // horizontal breeze
            pos[i*3] += Math.sin(time + i) * velocities[i].drift;

            // slight depth movement
            pos[i*3+2] += Math.cos(time + i) * velocities[i].drift * 0.5;

            if(pos[i*3+1] < 0){
                pos[i*3+1] =15;
            }
    }

    snowGeo.attributes.position.needsUpdate = true;

    renderer.render(scene,camera);
}

animate();

//resıze
window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}); 
    </script>
    
</body>
</html>
